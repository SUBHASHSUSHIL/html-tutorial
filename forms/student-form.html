<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Form — HTML Tutorial</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <div class="container">
        <a href="../index.html" class="back-link">&larr; Back to index</a>
        <h1>Student Form</h1>

        <div class="note">
            A basic form demonstrating text inputs, password, date/time pickers,
            radio buttons, checkboxes, and submit/reset buttons.
        </div>

        <!-- The form element wraps all input controls. method and action
             attributes would send data to a server in a real application. -->
        <form>

            <fieldset>
                <legend>Student's Details</legend>

                <!-- required makes the field mandatory before submission;
                     placeholder shows a hint inside the field -->
                <label for="student-name">Student Name:</label>
                <input type="text" id="student-name" required
                    placeholder="Enter name in capital letters" value="MR. RAM">

                <label for="address">Address:</label>
                <input type="text" id="address" placeholder="Enter residential address" size="40">

                <label for="password">Password:</label>
                <input type="password" id="password" minlength="8" maxlength="10">

                <label for="date">Date:</label>
                <input type="date" id="date">

                <label for="time">Time:</label>
                <input type="time" id="time">

                <label for="datetime">Date &amp; Time:</label>
                <input type="datetime-local" id="datetime">

                <label for="month">Month:</label>
                <input type="month" id="month">

                <label for="week">Week:</label>
                <input type="week" id="week">

                <label for="url">URL:</label>
                <input type="url" id="url" placeholder="https://example.com">

                <!-- Radio buttons sharing the same name attribute form a group;
                     only one can be selected at a time -->
                <div class="radio-group">
                    <span>Gender:</span>
                    <label><input type="radio" name="gender" value="male">Male</label>
                    <label><input type="radio" name="gender" value="female" checked>Female</label>
                </div>

                <!-- Checkboxes allow multiple selections -->
                <div class="checkbox-group">
                    <span>Hobby:</span>
                    <label><input type="checkbox" name="hobby" value="dance">Dance</label>
                    <label><input type="checkbox" name="hobby" value="music">Music</label>
                    <label><input type="checkbox" name="hobby" value="sports" checked>Sports</label>
                    <label><input type="checkbox" name="hobby" value="others">Others</label>
                </div>

                <input type="submit" value="Submit">
                <input type="reset" value="Clear Form">
            </fieldset>

        </form>
    </div>
</body>
</html>
